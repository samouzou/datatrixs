# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
  
  # Environment variables for the server-side runtime
  env:
    - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
      value: "pk_live_51HhOLjIAWwtv4OdWpNl9JHfGHwMkAvxKjTdDTJUhagPJZoisrNrYB63RNPSeGZAwQF6sSojTwFzjRgZEdYjJ0A6H002yGU7tnd" # Replace with your actual Publishable Key
    - variable: STRIPE_PRICE_ID_BASE_MONTHLY
      value: "price_1TJ0NTIAWwtv4OdWK4huLF12" # Replace with your actual Monthly Base Price ID
    - variable: STRIPE_PRICE_ID_BASE_ANNUAL
      value: "price_1TJ0SJIAWwtv4OdWhj0F1s3c" # Replace with your actual Annual Base Price ID
    - variable: STRIPE_PRICE_ID_LOCATION_MONTHLY
      value: "price_1TJ0TXIAWwtv4OdWl6t7Sy9j" # Replace with your actual Monthly Location Price ID
    - variable: STRIPE_PRICE_ID_LOCATION_ANNUAL
      value: "price_1TJ0aAIAWwtv4OdWJwuwJf9b" # Replace with your actual Annual Location Price ID
    
    # Sensitive keys should be stored in Cloud Secret Manager and referenced here
    # Example: firebase apphosting:secrets:set STRIPE_SECRET_KEY
    - variable: STRIPE_SECRET_KEY
      secret: STRIPE_SECRET_KEY
    - variable: STRIPE_WEBHOOK_SECRET
      secret: STRIPE_WEBHOOK_SECRET
    - variable: GEMINI_API_KEY
      secret: GEMINI_API_KEY
